# 客群数据系统 · kequn.fenqunshuju.com 反向代理（nginx）
# 放置：/etc/nginx/conf.d/kequn.fenqunshuju.com.conf
# 说明：服务器 80/443 已被既有 nginx 占用（保留），本配置挂到旧 nginx 的 include。
#       主站与异地隧道统一走 443：隧道 URL /tunnel/<port>/ 由 nginx 动态转发到后端隧道端口。
# 证书：解压 26768892_kequn.fenqunshuju.com_nginx.zip →
#       /etc/nginx/ssl/kequn.fenqunshuju.com.pem（含中间链）
#       /etc/nginx/ssl/kequn.fenqunshuju.com.key
# 后端：127.0.0.1:3011（静态前端 + API + WS 隧道 /ws/tunnel、/ws/ssh）

server {
    listen 80;
    listen 443 ssl;
    server_name kequn.fenqunshuju.com;

    ssl_certificate      /etc/nginx/ssl/kequn.fenqunshuju.com.pem;
    ssl_certificate_key  /etc/nginx/ssl/kequn.fenqunshuju.com.key;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          HIGH:!aNULL:!MD5;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  10m;

    client_max_body_size 200m;

    # 页面 / API / 安装脚本 / 发布包（后端统一托管 public/）
    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # WebSocket：异地隧道（门店连 /ws/tunnel）+ Web SSH 终端（/ws/ssh）
    location /ws/ {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 异地隧道统一入口：/tunnel/<port>/... → 后端隧道服务 127.0.0.1:<port>
    # （管理面板「异地打开」URL；无需开放隧道端口防火墙）
    location ~ ^/tunnel/(?<tport>[0-9]+)(?<trest>.*)$ {
        proxy_pass http://127.0.0.1:$tport$trest;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 隧道前缀（供后端 302 跳转带前缀，避免跳到根路径被 location / 抢走）
        proxy_set_header X-Forwarded-Prefix /tunnel/$tport;
        proxy_read_timeout 120s;
    }
}

# 客群数据系统 · kequn.fenqunshuju.com 反向代理（nginx）
# 放置：/etc/nginx/conf.d/kequn.fenqunshuju.com.conf
# 说明：服务器 80/443 已被既有 nginx 占用（保留），本系统主站使用 8443；
#       异地隧道端口段 33000-33999（避开既有 java 31001 与 SSH 隧道 32000-32999）。
# 证书：解压 26768892_kequn.fenqunshuju.com_nginx.zip →
#       /etc/nginx/ssl/kequn.fenqunshuju.com.pem（含中间链）
#       /etc/nginx/ssl/kequn.fenqunshuju.com.key
# 后端：127.0.0.1:3011（静态前端 + API + WS 隧道 /ws/tunnel、/ws/ssh）

# 主站（页面 / API / WS）：https://kequn.fenqunshuju.com:8443
server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name kequn.fenqunshuju.com;

    ssl_certificate     /etc/nginx/ssl/kequn.fenqunshuju.com.pem;
    ssl_certificate_key /etc/nginx/ssl/kequn.fenqunshuju.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 发布包/安装包上传可能较大
    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # WebSocket：异地隧道（门店控制台主动连）与 Web SSH 终端
    location /ws/ {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# 异地隧道端口（33000-33999）：同端口 TLS 转发到后端隧道服务
# 管理面板「异地打开」URL = https://kequn.fenqunshuju.com:<port>/t/<token>/
server {
    listen 33000-33999 ssl;
    server_name kequn.fenqunshuju.com;

    ssl_certificate     /etc/nginx/ssl/kequn.fenqunshuju.com.pem;
    ssl_certificate_key /etc/nginx/ssl/kequn.fenqunshuju.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:$server_port;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# 客群数据系统 · 本地/正式 MySQL 8（Docker 独立运行）
# 用法：docker compose up -d
# 覆盖配置：复制 .env.example 为 .env 后修改 MYSQL_* 变量
services:
  mysql:
    image: mysql:8.4
    container_name: fenqun-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-fenqun-root-dev}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fenqun}
      MYSQL_USER: ${MYSQL_USER:-fenqun}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-fenqun-dev-2026}
      TZ: Asia/Shanghai
    ports:
      # 宿主机端口 3307（避免与本地已有 MySQL 3306 冲突），容器内 3306
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  mysql-data:

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>设置新密码 · 分群运营系统</title>
  <link rel="icon" href="assets/logo-icon.png" type="image/png"/>
  <link rel="stylesheet" href="assets/common.css"/>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <img src="assets/logo.png" alt="分群数据" class="brand-logo lg"/>
    </div>
    <h1>设置新密码</h1>
    <p class="muted">首次登录或密码被重置，请先设置新密码后再进入系统。</p>
    <form id="pwdForm">
      <div class="field">
        <label>当前密码</label>
        <input type="password" id="curPwd" required placeholder="默认密码 / 初始密码" autocomplete="current-password"/>
      </div>
      <div class="field">
        <label>新密码</label>
        <input type="password" id="newPwd" required placeholder="至少 6 位" autocomplete="new-password"/>
      </div>
      <div class="field">
        <label>确认新密码</label>
        <input type="password" id="confirmPwd" required placeholder="再次输入新密码" autocomplete="new-password"/>
      </div>
      <button type="submit" class="btn" style="width:100%;margin-top:12px">保存并进入系统</button>
    </form>
    <p id="err" style="color:#dc2626;font-size:.88rem;display:none"></p>
  </div>
</div>
<script src="assets/api.js"></script>
<script src="assets/change-password.js"></script>
</body>
</html>

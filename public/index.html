<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>分群运营系统 · 登录</title>
  <link rel="icon" href="assets/logo-icon.png" type="image/png"/>
  <link rel="stylesheet" href="assets/common.css"/>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <img src="assets/logo.png" alt="分群数据" class="brand-logo lg"/>
    </div>
    <p class="muted">门店智能诊断 · 方案下发 · 执行闭环</p>
    <form id="loginForm">
      <div class="field">
        <label>邮箱</label>
        <input type="email" id="email" list="savedAccounts" required placeholder="admin@fenqun.local" autocomplete="username"/>
        <datalist id="savedAccounts"></datalist>
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" id="password" required placeholder="密码" autocomplete="current-password"/>
      </div>
      <div class="login-options">
        <label class="remember-row">
          <input type="checkbox" id="rememberPwd" checked/>
          <span>记住账号和密码</span>
        </label>
        <button type="button" class="btn-link" id="clearSaved" style="display:none">清除记录</button>
      </div>
      <button type="submit" class="btn" style="width:100%;margin-top:12px">登录</button>
    </form>
    <p id="err" style="color:#dc2626;font-size:.88rem;display:none"></p>
  </div>
</div>
<script src="assets/api.js"></script>
<script src="assets/login-page.js"></script>
</body>
</html>
